<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
<title id="title">Zafira Amelia cartoon illustration</title>
<desc id="desc">A cheerful cartoon girl with a blue polka-dot bow, dark hair, rosy cheeks and a blue top, resting her face on her hands.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e9f6ff"/><stop offset="1" stop-color="#b9e4ff"/></linearGradient>
 <linearGradient id="hair" x1="0" x2="1"><stop stop-color="#3b211b"/><stop offset=".5" stop-color="#6b3825"/><stop offset="1" stop-color="#2b1714"/></linearGradient>
 <linearGradient id="shirt" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#4aa0ef"/><stop offset="1" stop-color="#1769bd"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".16"/></filter>
</defs>
<rect x="10" y="10" width="500" height="600" rx="48" fill="url(#bg)" stroke="#d0e9f8" stroke-width="8"/>
